services:
  db:
    image: postgres:18.4
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=spacedchess
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it, this can pass against the
      # entrypoint's temporary Unix-socket-only server that runs while ./init
      # executes, before the real Postgres is listening.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d spacedchess"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/spacedchess
      - PORT=8080
      # Dev is plain http on localhost; set true behind TLS.
      - COOKIE_SECURE=false
    depends_on:
      db:
        condition: service_healthy
